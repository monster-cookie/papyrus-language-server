[workspace]
members = ["crates/papyrus-language-server", "grammar"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/monster-cookie/papyrus-language-server"
rust-version = "1.85"

[workspace.dependencies]
cc = "1.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[workspace.dependencies.winreg]
version = "0.55"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
