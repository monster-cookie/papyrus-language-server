name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Grammar and server
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install grammar tooling
        run: npm ci

      - name: Regenerate parser
        run: npm run grammar:generate

      - name: Reject generated parser drift
        run: git diff --exit-code -- grammar/src

      - name: Build WebAssembly grammar
        run: npm run grammar:build

      - name: Test grammar fixtures
        run: npm run grammar:test

      - name: Test native grammar corpus
        run: npm run grammar:test:native

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace
